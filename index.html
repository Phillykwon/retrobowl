<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Bowl Unblocked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg: #0F1419;
      --surface: #151C24;
      --line: #26313D;
      --text: #E8ECEF;
      --muted: #6B7785;
      --accent: #F2B84B; /* Retro football brown/gold tint */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
    }

    h1 span {
      color: var(--muted);
      font-weight: 500;
    }

    .meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .game-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>Retro Bowl <span>// Live Edition</span></h1>
    </div>
    <div class="meta">Status: Ready to Play</div>
  </header>

  <div class="game-container">
    <!-- Secure, active open-source Retro Bowl engine deployment iframe -->
    <iframe src="https://vercel.app" allow="autoplay; keyboard; focus;"></iframe>
  </div>

</body>
</html>
