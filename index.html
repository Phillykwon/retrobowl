<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mr-hazmat — live sites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1419;
    --surface: #151C24;
    --surface-hover: #1B2530;
    --line: #26313D;
    --text: #E8ECEF;
    --muted: #6B7785;
    --accent: #4FD1C5;
    --accent-dim: #2C6B65;
    --warn: #F2B84B;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  header {
    margin-bottom: 48px;
  }

  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .kicker .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.5);
    animation: pulse 2.2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.45); }
    70% { box-shadow: 0 0 0 8px rgba(79, 209, 197, 0); }
    100% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0); }
  }

  h1 {
    font-size: clamp(32px, 5vw, 44px);
    font-weight: 700;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  h1 span {
    color: var(--muted);
    font-weight: 500;
  }

  .sub {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 46ch;
  }

  .sub a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-dim); }
  .sub a:hover { border-color: var(--accent); }

  .board {
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
  }

  .board-head {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 16px;
    padding: 12px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }

  .col-status { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 16px;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--text);
    transition: background 0.15s ease;
  }

  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--surface-hover); }
  .row:hover .name { color: var(--accent); }
  .row:hover .arrow { transform: translateX(2px); opacity: 1; }

  .row-main {
    min-width: 0;
  }

  .name {
    font-weight: 600;
    font-size: 16px;
    transition: color 0.15s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .updated {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .arrow {
    color: var(--accent);
    opacity: 0;
    transition: all 0.15s ease;
    font-size: 15px;
  }

  .state {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .state.error { color: var(--warn); }

  footer {
    margin-top: 28px;
    text-align: center;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.04em;
  }

  footer a { color: var(--muted); }

  @media (max-width: 560px) {
    .board-head .col-updated, .row .updated { display: none; }
    .wrap { padding: 40px 18px 64px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker"><span class="dot"></span>github pages · live directory</div>
      <h1>mr-hazmat<span>/sites</span></h1>
      <p class="sub">Every repo under <a href="https://github.com/mr-hazmat" target="_blank" rel="noopener">github.com/mr-hazmat</a> that's deployed and reachable at its own <code>.github.io</code> address, pulled live from the GitHub API.</p>
    </header>

    <div class="board">
      <div class="board-head">
        <div>repository</div>
        <div class="col-updated">updated</div>
        <div></div>
      </div>
      <div id="content">
        <div class="state" id="loading">fetching repositories…</div>
      </div>
    </div>

    <footer>sorted a→z · source: api.github.com</footer>
  </div>

<script>
const USERNAME = "mr-hazmat";
const content = document.getElementById("content");

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const days = Math.floor(diff / 86400000);
  if (days < 1) return "today";
  if (days === 1) return "1 day ago";
  if (days < 30) return days + " days ago";
  const months = Math.floor(days / 30);
  if (months < 12) return months + (months === 1 ? " month ago" : " months ago");
  const years = Math.floor(months / 12);
  return years + (years === 1 ? " year ago" : " years ago");
}

async function fetchAllRepos() {
  let page = 1;
  let all = [];
  while (true) {
    const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}`, {
      headers: { "Accept": "application/vnd.github+json" }
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.message || `GitHub API error (${res.status})`);
    }
    const batch = await res.json();
    all = all.concat(batch);
    if (batch.length < 100) break;
    page += 1;
  }
  return all;
}

function siteUrl(repoName) {
  return repoName.toLowerCase() === `${USERNAME}.github.io`
    ? `https://${USERNAME}.github.io/`
    : `https://${USERNAME}.github.io/${repoName}/`;
}

fetchAllRepos()
  .then(repos => {
    const pages = repos
      .filter(r => r.has_pages)
      .sort((a, b) => a.name.localeCompare(b.name));

    if (pages.length === 0) {
      content.innerHTML = `<div class="state">no repos with GitHub Pages enabled yet</div>`;
      return;
    }

    content.innerHTML = pages.map(r => `
      <a class="row" href="${siteUrl(r.name)}" target="_blank" rel="noopener">
        <div class="row-main">
          <div class="name">${r.name}</div>
          <div class="url">${siteUrl(r.name).replace('https://', '')}</div>
        </div>
        <div class="updated">${timeAgo(r.pushed_at)}</div>
        <div class="arrow">→</div>
      </a>
    `).join("");
  })
  .catch(err => {
    content.innerHTML = `<div class="state error">couldn't load repositories — ${err.message}</div>`;
  });
</script>
</body>
</html>
